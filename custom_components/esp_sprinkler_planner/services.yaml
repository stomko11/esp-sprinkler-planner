configure:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    zones:
      selector:
        object:
    slots:
      selector:
        object:
    settings:
      selector:
        object:
    notifications:
      selector:
        object:
    pump:
      selector:
        object:
    ui:
      selector:
        object:
    meters:
      selector:
        object:
    weather:
      selector:
        object:
test_notification:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    event:
      required: true
      selector:
        select:
          options: [planned, started, zone_changed, finished, skipped, stopped, error, pump_off, dry_run]
    targets:
      selector:
        text:
          multiple: true
get_plan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 31
run_slot:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    slot:
      required: true
      selector:
        text:
run_zone:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    zone:
      required: true
      selector:
        text:
    minutes:
      required: true
      selector:
        number:
          min: 0.1
          max: 600
          step: 0.1
          unit_of_measurement: min
stop:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
skip_next:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
replan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
quick_run:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    zones:
      required: true
      example: '[{"zone": "zone_1", "minutes": 5}, {"zone": "zone_3", "minutes": 10}]'
      selector:
        object:
    reverse:
      selector:
        boolean:
unskip:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    run:
      selector:
        text:
answer_suggestion:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    run:
      required: true
      selector:
        text:
    accept:
      selector:
        boolean:
    reset:
      selector:
        boolean:
refresh_weather:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
get_stats:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    period:
      selector:
        select:
          options: [day, week, month, year]
    count:
      selector:
        number:
          min: 1
          max: 400
skip_run:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    run:
      required: true
      example: "2026-11-15|morning"
      selector:
        text:
clear_skips:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    answers:
      default: true
      selector:
        boolean:
reset_flow:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    zone:
      example: zone_3
      selector:
        text:
clear_stats:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    confirm:
      required: true
      selector:
        boolean:
leak_snooze:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    minutes:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
pause:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    days:
      selector:
        number:
          min: 1
          max: 365
    until:
      example: "2026-11-30"
      selector:
        date:
resume:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
answer_blocker:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: esp_sprinkler_planner
    answer:
      required: true
      selector:
        select:
          options: [run, skip, wait]
